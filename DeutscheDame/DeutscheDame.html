<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsche Dame</title><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../Shared/savedGameNotice.css"><link rel="stylesheet" href="style.css"></head>
<body class="game-page game-deutsche-dame" data-mobile-orientation="both" data-game-storage="DeutscheDameStorage" data-adaptive-bot="DeutscheDameAdaptiveBot">
<div id="backIcon">⟵ Menü</div><a id="helpIcon" class="help-button" href="Anleitung.html">Anleitung</a><button id="settingsToggle" class="secondary-button" type="button" aria-expanded="false" aria-controls="extraSettings">⚙</button><span id="soundToggle" role="status" aria-live="polite">🔊</span>
<main class="app">
<section id="setupScreen" class="screen setup-screen" aria-labelledby="setupTitle"><h1 id="setupTitle" class="title game-title setup-screen-title">Deutsche Dame</h1><div class="settings"><div class="cycle-group setting-row"><div class="label">Spieler</div><button id="modeButton" class="cycle-button" type="button">1 Spieler</button></div><div class="cycle-group setting-row"><div class="label">Match</div><button id="matchButton" class="cycle-button" type="button">Einzelrunde</button></div><div class="cycle-group setting-row"><div class="label">Gegner</div><button id="botButton" class="cycle-button" type="button">Anfänger</button></div><div class="cycle-group setting-row"><div class="label">Anpassung</div><button id="adaptiveButton" class="cycle-button" type="button" disabled>—</button></div></div><select id="mode" hidden><option value="bot">1 Spieler gegen Bot</option><option value="human">2 Spieler</option></select><select id="botLevel" hidden><option value="1">Anfänger</option><option value="2">Hobbyspieler</option><option value="3">Vereinsspieler</option><option value="4">Meister</option></select><select id="botType" hidden><option value="manual">Manueller Bot</option><option value="adaptive">Adaptiver Bot</option></select><select id="match" hidden><option value="single">Einzelrunde</option><option value="match">Abwechselnd</option></select><select id="adaptSpeed" hidden><option value="slow">Langsam</option><option value="normal" selected>Normal</option><option value="fast">Schnell</option></select><div class="game-actions"><button id="start" class="primary-button" type="button">Jetzt spielen</button><button id="resume" class="primary-button" type="button" hidden>Spiel fortsetzen</button><div class="landscape-setup-tools" aria-label="Weitere Einstellungen"><button id="setupExtraSettingsToggle" class="secondary-button setup-extra-settings-button" type="button" aria-label="Weitere Einstellungen">⚙</button></div></div></section>
<div id="resumeConfirmBackdrop" class="deutsche-dame-confirm-backdrop" data-dialog-prefix="deutsche-dame" hidden></div>
<section id="gameScreen" class="screen game-screen" hidden><header class="game-screen-header"><button id="backSetup" class="mobile-settings-back secondary-button">← Zurück</button><h2 class="game-title">Deutsche Dame</h2><div class="game-screen-controls"><button id="fullscreen" class="secondary-button fullscreen-toggle">⛶ Vollbild</button></div></header><div class="game-layout"><div class="dame-side-column"><aside><div id="status" class="game-info">Spieler 1 ist am Zug</div><p id="hint">Wähle einen Stein.</p><div class="scoreboard"><span>Weiß: <b id="whiteCount">12</b></span><span id="matchScore" class="match-score" hidden>0:0</span><span>Schwarz: <b id="blackCount">12</b></span></div><div id="adaptivePanel" class="adaptive-panel" hidden aria-live="polite"><div class="adaptive-strength-row"><span>Adaptive Stärke</span><div id="adaptiveStrengthTrack" class="adaptive-strength-track" role="progressbar" aria-label="Adaptive Stärke 35 von 100" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35"><span id="adaptiveStrengthFill"></span></div><strong id="adaptiveStrengthValue">35%</strong></div></div><button id="abort" class="secondary-button">Spiel abbrechen</button></aside><div class="mobile-game-actions" aria-label="Spielaktionen"><button id="mobileGameAction" class="primary-button" type="button">Spiel abbrechen</button></div></div><div id="board" class="board" role="grid" tabindex="-1" aria-label="Damebrett" aria-describedby="hint"></div></div></section>
<div id="settingsBackdrop" class="settings-backdrop" hidden></div><section id="extraSettings" class="extra-settings" hidden><h2>Einstellungen</h2><button id="settingsSound" class="settings-action" type="button">🔊 Sound an</button><button id="settingsClose" class="settings-action settings-close" type="button">Schließen</button></section><footer class="footer">Andis Game Foundry | Deutsche Dame | by Andreas Rollinger | 2026.10.31</footer>
</main>
<script src="../Shared/soundManager.js"></script><script src="../Shared/difficultyCore.js"></script><script src="settings.js"></script><script src="storage.js"></script><script src="../Shared/mobileLayout.js"></script><script src="../Shared/boardLayout.js"></script><script src="../Shared/savedGameNotice.js"></script><script src="../Shared/resumeGameDialog.js"></script><script src="../Shared/matchConfirm.js"></script><script src="../Shared/navigationGuard.js"></script><script src="../Shared/botTiming.js"></script><script src="aiCore.js"></script><script src="manuellBot.js"></script><script src="adaptiveBot.js"></script><script src="game.js"></script><script src="../Shared/settingsMenu.js"></script><script src="../Shared/buttonOverflow.js"></script><script>
const cycle=(button,select,labels)=>button.addEventListener('click',()=>{select.selectedIndex=(select.selectedIndex+1)%select.options.length;button.textContent=labels[select.value];});cycle(modeButton,mode,{bot:'1 Spieler',human:'2 Spieler'});const botLabels=['Anfänger','Hobbyspieler','Vereinsspieler','Meister','Adaptiv'];function updateAdaptiveSetup(){adaptiveButton.disabled=botType.value!=='adaptive'||mode.value!=='bot';if(botType.value!=='adaptive'||mode.value!=='bot')adaptiveButton.textContent='—';else adaptiveButton.textContent={slow:'Langsam',normal:'Normal',fast:'Schnell'}[adaptSpeed.value]||'Normal';window.updateDeutscheDameAdaptiveBadge?.();}modeButton.addEventListener('click',updateAdaptiveSetup);botButton.addEventListener('click',()=>{if(botType.value==='adaptive'){botType.value='manual';botLevel.value='1';}else if(Number(botLevel.value)<4){botLevel.value=String(Number(botLevel.value)+1);}else{botType.value='adaptive';}botButton.textContent=botType.value==='adaptive'?'Adaptiv':botLabels[Number(botLevel.value)-1];updateAdaptiveSetup();});adaptiveButton.addEventListener('click',()=>{if(adaptiveButton.disabled)return;adaptSpeed.selectedIndex=(adaptSpeed.selectedIndex+1)%adaptSpeed.options.length;updateAdaptiveSetup();});const menuButtonInline=document.getElementById('backIcon');menuButtonInline.style.display=new URLSearchParams(location.search).get('menu')==='1'?'block':'none';
</script><script>document.getElementById('matchButton').addEventListener('click',()=>{const matchSelect=document.getElementById('match');matchSelect.value=matchSelect.value==='single'?'match':'single';window.updateDeutscheDameMatchUI?.();});</script></body></html>
