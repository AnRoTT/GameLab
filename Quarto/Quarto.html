<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quarto</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../theme.css" />
</head>
<body class="game-page game-quarto" data-mobile-orientation="both" data-adaptive-bot="QuartoAdaptiveBot">
    <div id="backIcon">⟵ Menü</div>
    <a id="helpIcon" class="help-button" href="Anleitung.html" aria-label="Kurzanleitung zu Quarto">Anleitung</a>
    <button id="settingsToggle" class="secondary-button" type="button" aria-expanded="false" aria-controls="extraSettings" aria-label="Einstellungen" title="Einstellungen">⚙</button>
    <span id="soundToggle" role="status" aria-live="polite" aria-label="Ton eingeschaltet">🔊</span>

        <section id="setupScreen" class="screen setup-screen" aria-labelledby="setupTitle">
            <h1 id="setupTitle" class="game-title">Quarto</h1>

            <div class="settings">
                <div class="cycle-group setting-row">
                    <span class="label">Spieler:</span>
                    <button id="modeButton" class="cycle-button" type="button">1 Spieler</button>
                </div>

                <div class="cycle-group setting-row">
                    <span class="label">Match:</span>
                    <button id="matchButton" class="cycle-button" type="button">Einzelrunde</button>
                </div>

                <div class="opponent-pair setting-row" id="rowOpponent">
                    <div class="cycle-group">
                        <span class="label">Gegner:</span>
                        <button id="botLevelButton" class="cycle-button" type="button">Anfänger</button>
                    </div>
                    <div class="cycle-group">
                        <span class="label">Anpassung:</span>
                        <button id="adaptiveButton" class="cycle-button adaptive-speed-control" type="button" disabled aria-label="Anpassungsgeschwindigkeit">—</button>
                    </div>
                </div>

            </div>
        <div class="game-actions">
            <button id="startButton" class="primary-button" type="button">Jetzt spielen</button>
            <div class="landscape-setup-tools" aria-label="Weitere Einstellungen">
                <button id="setupExtraSettingsToggle" class="secondary-button setup-extra-settings-button" type="button" aria-label="Weitere Einstellungen" title="Weitere Einstellungen">⚙</button>
            </div>
        </div>
        </section>
        <div id="settingsBackdrop" class="settings-backdrop" hidden></div>
        <section id="extraSettings" class="extra-settings" hidden>
            <h2>Einstellungen</h2>
            <button id="settingsSound" class="settings-action" type="button">🔊 Sound an</button>
            <button id="resetPlayerValues" class="settings-action danger" type="button">Spielerwerte löschen</button>
            <button id="settingsClose" class="settings-action settings-close" type="button">Schließen</button>
            <div id="resetConfirm" class="reset-confirm" hidden><p>Adaptive Spielerwerte wirklich löschen?</p><div><button id="resetCancel" class="settings-action" type="button">Abbrechen</button><button id="resetConfirmButton" class="settings-action danger" type="button">Löschen</button></div></div>
        </section>

        <section id="gameScreen" class="screen game-screen" hidden aria-live="polite">
        <div class="game-screen-header" aria-label="Spielsteuerung">
            <button id="mobileSettingsBack" class="mobile-settings-back" type="button" aria-label="Zu den Spieleinstellungen">← Einstellungen</button>
            <h1 class="game-title">Quarto</h1>
            <div class="game-screen-controls">
                <button id="fullscreenToggle" class="secondary-button fullscreen-toggle" type="button" aria-label="Vollbild aktivieren">⛶ Vollbild</button>
            </div>
        </div>

        <main>
            <section class="status-panel" aria-live="polite">
                <div id="statusText" class="status-text">Spiel starten</div>
                <div id="matchLine" class="match-line">Einzelrunde - Offizielle Regeln</div>
                <div class="scoreboard" aria-label="Punktestand">
                    <div class="score">
                        <span class="score-label">Spieler 1</span>
                        <span id="scorePlayer1" class="score-value">0</span>
                    </div>
                    <div class="score">
                        <span class="score-label">Spieler 2</span>
                        <span id="scorePlayer2" class="score-value">0</span>
                    </div>
                </div>
                <div id="adaptivePanel" class="adaptive-panel" aria-live="polite">
                    <div class="adaptive-strength-row">
                        <span>Adaptive Stärke</span>
                        <div id="adaptiveStrengthTrack" class="adaptive-strength-track" role="progressbar" aria-label="Adaptive Stärke" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35">
                            <span id="adaptiveStrengthFill" class="adaptive-strength-fill"></span>
                        </div>
                        <strong id="adaptiveStrengthValue">35%</strong>
                    </div>
                </div>
            </section>

            <section class="game-area">
                <div class="piece-panel">
                    <h2>Spielsteine</h2>
                    <div id="piecePool" class="piece-pool" aria-label="Verfügbare Quarto-Spielsteine"></div>
                </div>

                <div class="board-wrapper">
                    <div id="board" class="board" role="grid" aria-label="Quarto-Spielbrett"></div>
                </div>
            </section>

            <div class="mobile-game-actions" aria-label="Spielaktionen">
                <button id="mobileGameAction" class="primary-button" type="button">Spiel abbrechen</button>
            </div>

        </main>

        </section>

        <footer class="footer">Andis Game Foundry | Quarto | by Andreas Rollinger | 2026.08.17</footer>

    <script src="../Shared/soundManager.js"></script>
    <script src="../Shared/difficultyCore.js"></script>
    <script src="aiCore.js"></script>
    <script src="manuellBot.js"></script>
    <script src="adaptiveBot.js"></script>
    <script src="../Shared/mobileLayout.js"></script>
    <script src="../Shared/boardLayout.js"></script>
    <script src="game.js"></script>
    <script src="../Shared/matchConfirm.js"></script>
    <script src="../Shared/settingsMenu.js"></script>
    <script src="../Shared/buttonOverflow.js"></script>
    <script>
        const backIcon = document.getElementById("backIcon");
        backIcon.style.display =
            new URLSearchParams(location.search).get("menu") === "1" ? "block" : "none";
        backIcon.addEventListener("click", (event) => {
            event.preventDefault();
            const sound = new Audio("../assets/sounds/Button_Click.mp3");
            sound.volume = 0.22;
            sound.play().catch(() => {});
            setTimeout(() => {
                window.location.href = "../index.html?menu=1";
            }, 100);
        });
        document.getElementById("helpIcon").addEventListener("click", (event) => {
            event.preventDefault();
            const sound = new Audio("../assets/sounds/Button_Click.mp3");
            sound.volume = 0.22;
            sound.play().catch(() => {});
            setTimeout(() => {
                window.location.href = document.getElementById("helpIcon").href;
            }, 100);
        });
    </script>
</body>
</html>
