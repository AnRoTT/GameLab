<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Othello / Reversi</title>
    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="backIcon">⟵ Menü</div>

<div class="container">
    <div class="title">Othello / Reversi</div>

    <!-- Einstellungen -->
    <div id="settingsPanel" class="menu">
        <div class="cycle-group setting-row">
            <div class="label">Spielmodus</div>
            <button id="modeBtn" class="cycle-button">1 Spieler</button>
        </div>
        <div class="cycle-group setting-row">
            <div class="label">Regelmodus</div>
            <button id="rulesBtn" class="cycle-button">Standard</button>
        </div>
        <div id="botLevelRow" class="cycle-group setting-row">
            <div class="label">Level</div>
            <button id="botLevelBtn" class="cycle-button">Anfänger</button>
        </div>
        <div id="adaptSpeedRow" class="cycle-group setting-row">
            <div class="label">Anpassung</div>
            <button id="adaptSpeedBtn" class="cycle-button">Normal</button>
        </div>
        <button id="startBtn" class="primary-button">Jetzt spielen</button>
    </div>

<!-- NEU: Infoleiste - die einzige mit status/score -->
<div id="gameInfo" class="game-info">
    <div id="status" class="status">Wähle den Modus und starte</div> <!-- DIESE ZEILE NEU -->
    <div class="score-bar">
        <span>Schwarz: <span id="scoreBlack">2</span></span>
        <span>Weiß: <span id="scoreWhite">2</span></span>
    </div>
    <div id="adaptiveStrengthPanel" class="adaptive-strength" hidden>
        <div class="adaptive-strength-label">Botstärke <span id="adaptiveStrengthValue">50%</span></div>
        <div class="adaptive-strength-track"><div id="adaptiveStrengthBar"></div></div>
    </div>
</div>

    <!-- Spielfeld -->
    <div id="boardWrapper" style="margin-top:10px;">
        <div id="board" class="board disabled"></div>
    </div>

    <footer class="footer">Othello | by Andreas Rollinger | 2026.08.06</footer>
</div>

<script src="aiCore.js"></script>
<script src="manuellBot.js"></script>
<script src="adaptiveBot.js"></script>
<script src="game.js"></script>
<script>
    const backIcon = document.getElementById("backIcon");
    backIcon.style.display =
        new URLSearchParams(location.search).get("menu") === "1" ? "block" : "none";
    backIcon.onclick = () => {
        const sound = new Audio("../assets/sounds/Button_Click.mp3");
        sound.volume = 0.22;
        sound.play().catch(()=>{});
        setTimeout(() => {
            window.location.href = "../index.html?menu=1";
        }, 100);
    };
</script>
</body>
</html>
