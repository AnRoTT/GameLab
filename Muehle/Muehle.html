<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mühle</title>
    <link rel="stylesheet" href="style.css?v=20260904-1">
    <link rel="stylesheet" href="../theme.css">
</head>
<body class="game-page game-muehle" data-mobile-orientation="both" data-adaptive-bot="MuehleAdaptiveBot">
<script src="settings.js?v=20260831-2"></script>
<div id="backIcon">⟵ Menü</div><a id="helpIcon" class="help-button" href="Anleitung.html" aria-label="Kurzanleitung zu Mühle">Anleitung</a><button id="settingsToggle" class="secondary-button" type="button" aria-expanded="false" aria-controls="extraSettings" aria-label="Einstellungen">⚙</button><span id="soundToggle" role="status" aria-live="polite" aria-label="Ton eingeschaltet">🔊</span>
<main class="app">
    <section id="setupScreen" class="screen setup-screen" aria-labelledby="setupTitle">
        <h1 id="setupTitle" class="game-title">Mühle</h1>
        <div class="settings">
            <div class="cycle-group setting-row"><span class="label">Spieler:</span><button id="modeButton" class="cycle-button" type="button">1 Spieler</button></div>
            <div class="cycle-group setting-row"><span class="label">Match:</span><button id="matchButton" class="cycle-button" type="button">Einzelrunde</button></div>
            <div class="opponent-pair setting-row" id="rowOpponent"><div class="cycle-group"><span class="label">Gegner:</span><button id="botLevelButton" class="cycle-button" type="button">Anfänger</button></div><div class="cycle-group"><span class="label">Anpassung:</span><button id="adaptiveButton" class="cycle-button adaptive-speed-control" type="button" disabled>—</button></div></div>
            <select id="modeSelect" hidden><option value="computer">1 Spieler</option><option value="human">2 Spieler</option></select><select id="botTypeSelect" hidden><option value="manual">Manueller Bot</option><option value="adaptive">Adaptiver Bot</option></select><select id="botLevelSelect" hidden><option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option></select><select id="speedSelect" hidden><option value="slow">Langsam</option><option value="normal" selected>Normal</option><option value="fast">Schnell</option></select><select id="matchSelect" hidden><option value="single">Einzelrunde</option><option value="match">Abwechselndes Match</option></select>
        </div>
        <div class="game-actions"><button id="startButton" class="primary-button" type="button">Jetzt spielen</button><div class="landscape-setup-tools" aria-label="Weitere Einstellungen"><button id="setupExtraSettingsToggle" class="secondary-button setup-extra-settings-button" type="button" aria-label="Weitere Einstellungen">⚙</button></div></div>
    </section>
    <section id="gameScreen" class="screen game-screen" hidden aria-live="polite">
        <div class="game-screen-header"><button id="mobileSettingsBack" class="mobile-settings-back" type="button">← Einstellungen</button><h2 class="game-title">Mühle</h2><div class="game-screen-controls"><button id="fullscreenToggle" class="secondary-button fullscreen-toggle" type="button">⛶ Vollbild</button></div></div>
        <div class="muehle-layout">
            <div class="muehle-side-column">
            <section class="game-side-panel" aria-label="Spielinformationen"><div id="status" class="game-info" aria-live="polite">Spiel starten</div><div class="phase-action-line"><span id="phase" class="phase-badge">Aufbauphase</span><span class="phase-separator" aria-hidden="true">:</span><span id="actionHint" class="action-hint">Setze einen Stein.</span></div><div class="scoreboard"><div><span id="playerOneName" class="score-label">Spieler 1</span><span id="playerOneCount" class="score-value">9</span></div><span id="matchScore" class="match-score" hidden>0:0</span><div><span id="playerTwoName" class="score-label">Spieler 2</span><span id="playerTwoCount" class="score-value">9</span></div></div><div id="adaptivePanel" class="adaptive-panel" aria-live="polite"><div class="adaptive-strength-row"><span>Adaptive Stärke</span><div id="adaptiveStrengthTrack" class="adaptive-strength-track" role="progressbar" aria-label="Adaptive Stärke 35 von 100" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35"><span id="adaptiveStrengthFill" class="adaptive-strength-fill"></span></div><strong id="adaptiveStrengthValue">35%</strong></div></div></section>
            <div class="mobile-game-actions" aria-label="Spielaktionen"><button id="mobileGameAction" class="primary-button" type="button">Spiel abbrechen</button></div>
            </div>
            <div id="boardWrapper" class="board-wrapper"><div id="board" class="muehle-board" role="group" aria-label="Mühlebrett"></div></div>
        </div>
    </section>
    <div id="settingsBackdrop" class="settings-backdrop" hidden></div><section id="extraSettings" class="extra-settings" hidden><button id="settingsSound" class="settings-action" type="button">🔊 Sound an</button><button id="resetPlayerValues" class="settings-action danger" type="button">Spielerwerte löschen</button><button id="settingsClose" class="settings-action settings-close" type="button">Schließen</button><div id="resetConfirm" class="reset-confirm" hidden><p>Adaptive Spielerwerte wirklich löschen?</p><button id="resetCancel" class="settings-action" type="button">Abbrechen</button><button id="resetConfirmButton" class="settings-action danger" type="button">Löschen</button></div></section>
    <footer class="footer">Andis Game Foundry | Mühle | by Andreas Rollinger | 2026.08.23</footer>
</main>
<script src="../Shared/soundManager.js"></script><script src="../Shared/difficultyCore.js?v=20260902-4"></script><script src="aiCore.js?v=20260904-2"></script><script src="manuellBot.js?v=20260904-2"></script><script src="adaptiveBot.js?v=20260904-2"></script><script src="../Shared/botTiming.js"></script><script src="../Shared/mobileLayout.js"></script><script src="../Shared/navigationGuard.js"></script><script src="../Shared/boardLayout.js"></script><script src="game.js?v=20260904-2"></script><script src="../Shared/matchConfirm.js"></script><script src="../Shared/settingsMenu.js"></script><script src="../Shared/buttonOverflow.js"></script>
<script>const backIcon=document.getElementById("backIcon");const helpIcon=document.getElementById("helpIcon");backIcon.style.display=new URLSearchParams(location.search).get("menu")==="1"?"block":"none";helpIcon.addEventListener("click",(event)=>{event.preventDefault();window.AndisSound?.playUiClick?.(0.22);setTimeout(()=>{window.location.href=helpIcon.href;},100);});</script>
</body></html>
